name: Compartir Campaña en Foros

on:
  schedule:
    - cron: '0 */8 * * *' # Cada 8 horas
  workflow_dispatch:

jobs:
  compartir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Compartir Enlace
        run: python gist_bot.py
