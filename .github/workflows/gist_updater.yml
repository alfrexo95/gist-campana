name: Actualizar Gist y Compartir

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  update_and_share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Ejecutar Bot
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PIEFED_USER: ${{ secrets.PIEFED_USER }}
          PIEFED_PASS: ${{ secrets.PIEFED_PASS }}
        run: python gist_bot.py
